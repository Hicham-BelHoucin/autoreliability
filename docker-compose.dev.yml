services:
  web:
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3000"]
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
      DATABASE_URL: postgresql://${POSTGRES_USER:-automotive}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-automotive}
      DATABASE_SSL: "false"
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      PUBLIC_SUPPORT_EMAIL: ${PUBLIC_SUPPORT_EMAIL:-support@autoreliabilityintelligence.com}
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules

volumes:
  web_node_modules:
