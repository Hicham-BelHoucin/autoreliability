services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-automotive}
      POSTGRES_USER: ${POSTGRES_USER:-automotive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ./web
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-automotive}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-automotive}
      DATABASE_SSL: "false"
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      PUBLIC_SUPPORT_EMAIL: ${PUBLIC_SUPPORT_EMAIL:-support@autoreliabilityintelligence.com}
      CONTACT_FROM_EMAIL: ${CONTACT_FROM_EMAIL:-}
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      PUBLIC_PLAUSIBLE_DOMAIN: ${PUBLIC_PLAUSIBLE_DOMAIN:-}
      NODE_ENV: production
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-automotive}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-automotive}
      VEHICLE_TARGETS: ${VEHICLE_TARGETS:-[]}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-21600}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NHTSA_ENRICH_ON_SYNC: ${NHTSA_ENRICH_ON_SYNC:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command: ["/bin/sh", "-c", "while true; do python -m pipeline.ingest; sleep $$SYNC_INTERVAL_SECONDS; done"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
